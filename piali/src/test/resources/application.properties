spring.application.name=piali-test

# Base de datos: H2 en memoria, modo PostgreSQL (sin Docker).
# LOCK_TIMEOUT alto para que los hilos esperen su turno (y la carrera se reproduzca de forma estable).
spring.datasource.url=jdbc:h2:mem:pialitest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El esquema se genera desde las entidades (sin Flyway en tests).
# Asi el esquema siempre coincide con las entidades actuales (p.ej. al agregar @Version).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.jackson.default-property-inclusion=non_null

# Valores dummy para que arranquen los beans (Cloudinary, JWT, DataInitializer).
# No se usan de verdad en estos tests (no se firman tokens ni se llama a Cloudinary).
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# Secreto base64 de relleno (decodifica a >32 bytes por si algo lo usa).
jwt.secret=YWRtaW5zZWNyZXRrZXlmb3J0ZXN0aW5ncHVycG9zZXNvbmx5MTIzNDU2Nzg5MA==
jwt.expiration=900000
jwt.refresh-expiration=604800000

app.core.allowed-origins=http://localhost:3000

admin.email=admin@test.mx
admin.password=admin1234
